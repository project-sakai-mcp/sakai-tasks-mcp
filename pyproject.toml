[project]
name = "sakai-tasks-mcp"
version = "0.1.0"
description = "Sakai LMS MCP Server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2.0,<2.0.0",
    "pydantic>=2.7.0",
    "platformdirs>=4.2.0",
    "httpx>=0.27.0",
    "pywebview>=5.0.0",
    "cryptography>=42.0.0",
    "keyring>=24.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"
