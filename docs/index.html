ctor User as ユーザー / クライアント\n    participant Sakai as ① Sakai (/portal/login)\n    participant IdP as ② 大学認証基盤 (IdP / Microsoft 365)\n\n    User->>Sakai: GET /portal/login\n    Sakai-->>User: 302 Found (IdP へ SAML AuthnRequest)\n    User->>IdP: IdP 認証 URL へアクセス (IdP Cookie を送信)\n\n    alt パターン A: IdP セッション有効 (ほとんどの場合)\n        Note over IdP: IdP の永続 Cookie (ESTSAUTHPERSISTENT 等) が有効\n        IdP-->>User: パスワード入力なしで SAMLResponse (POSTフォーム) を即返却\n        User->>Sakai: POST /saml/SSO (SAMLResponse 送信)\n        Sakai-->>User: 新しい SAKAI2SESSIONID & _shibsession 発行 (0.5秒で完了!)\n    else パターン B: IdP セッション失効 (数週間に1度)\n        Note over IdP: IdP Cookie も失効 / 期限切れ\n        IdP-->>User: パスワード入力 & 2要素認証画面を表示\n        User->>IdP: パスワード・2要素認証を入力\n        IdP-->>User: SAMLResponse 返却\n        User->>Sakai: POST /saml/SSO\n        Sakai-->>User: ログイン完了\n    end\n```\n\n### パターン A: 自動素通り認証（操作不要 / 0.5 秒）\n* **条件**: 大学 IdP 側の永続 Cookie（有効期限: 数日〜数週間）がブラウザストレージに残っている場合。\n* **動作**: 画面上でのパスワード入力や 2 要素認証は一切発生せず、リダイレクトと POST 送信が全自動で走り、即座に新しい Sakai セッションが発行される。\n\n### パターン B: 完全手動再認証\n* **条件**: 大学 IdP 側の最大有効期限が切れた場合、またはブラウザのシークレットモード等でディスク Cookie が存在しない場合。\n* **動作**: 大学のログイン画面が表示され、ユーザーによるパスワード・2 要素認証の入力が必要となる。\n\n---\n\n## 4. なぜ純粋な HTTP GET では再ログインできず、WebView2 が必要か？\n\nPython の `httpx.get()` だけで `/portal/login` のリダイレクトを追従しても、以下の理由から自動認証は完了しません。\n\n1. **SAML POST Binding の壁**:\n   IdP が認証成功した際、Sakai に戻す方法は `302 リダイレクト (GET)` ではなく、**`200 OK` の HTML フォームと JavaScript（`document.forms[0].submit()`）** です。`httpx` は JavaScript を実行できないため、フォーム自動送信ができません。\n2. **IdP の JavaScript 依存**:\n   Microsoft 365 などのモダン IdP は、ブラウザの WebCrypto や SPA（Single Page Application）スクリプトを実行してセッション検証を行います。\n3. **Cookie のドメイン分離**:\n   IdP の永続 Cookie は Windows のブラウザストレージ内に保存されており、Python のセッションには直接含まれていません。\n\n👉 **解決策**: Windows 標準の **Edge (WebView2 / `pywebview`)** を利用し、ブラウザエンジンに JavaScript 実行・POST Binding・Cookie 照合をすべて任せることで、完全かつ安定した自動認証を実現します。\n\n---\n\n## 5. WebView2 による自動再認証の実装設計\n\n### 5.1 基本アーキテクチャ\n\n```mermaid\nflowchart TD\n    A[\"API 呼び出し\"] --> B{\"セッション確認<br/>(userEid != null?)\"}\n    B -- \"有効 (OK)\" --> C[\"REST API から課題データ取得 (httpx)\"]\n    \n    B -- \"失効 (24h経過)\" --> D[\"WebView2 起動<br/>(固定プロファイルディレクトリ指定)\"]\n    D --> E[\"https://<host>/portal/login をロード\"]\n    \n    E --> F{\"0.5〜1秒で<br/>/portal に戻ったか?\"}\n    \n    F -- \"YES (パターンA: 自動素通り)\" --> G[\"Cookie (SAKAI2SESSIONID等) を抽出\"]\n    F -- \"NO (パターンB: 認証待ち)\" --> H[\"ウィンドウを表示しユーザー入力を待機\"]\n    H --> G\n    \n    G --> I[\"session.json に Cookie 保存\"]\n    I --> J[\"WebView2 ウィンドウ破棄 (destroy)\"]\n    J --> C\n```\n\n### 5.2 実装上の重要パラメータ\n\n1. **プロファイルの永続化 (`user_data_dir`)**:\n   一時ディレクトリではなく、ローカルの固定パス（例: `%LOCALAPPDATA%\\sakai-tasks-mcp\\webview_profile`）を指定して WebView2 を起動する。これにより、IdP の永続 Cookie がディスクに維持され、パターン A（自動素通り）が機能する。\n2. **ログイン直行 URL**:\n   トップページ（`/portal`）ではなく、常に **`https://<sakai-host>/portal/login`** を開くことで、無駄なクリック操作なしに即座に SAML リダイレクトを開始させる。\n3. **完了検知**:\n   * WebView2 の URL が `/portal` または `/portal/site/...` に戻ったこと\n   * または Cookie ストレージに `userEid` を持つ有効な `SAKAI2SESSIONID` が生成されたこと\n   を検知した瞬間に `window.destroy()` を実行してバックグラウンドに戻る。\n\n---\n\n## 6. 各大学の Sakai サイトにおける共通点と汎用性\n\n本アーキテクチャは、大学ごとにホスト名を設定するだけで共通して動作します。\n\n| 大学 / システム | ポータル URL | ログイン直行 URL | 認証方式 |\n| :--- | :--- | :--- | :--- |\n| **京都大学 (PandA)** | `https://panda.ecs.kyoto-u.ac.jp/portal` | `https://panda.ecs.kyoto-u.ac.jp/portal/login` | CAS / Shibboleth SSO |\n| **名大・岐大 (TACT)** | `https://tact.ac.thers.ac.jp/portal` | `https://tact.ac.thers.ac.jp/portal/login` | 機構統合認証 (Microsoft 365 / Shibboleth) |\n| **京都女子大学 (LMS)** | `https://lms.kyoto-wu.ac.jp/portal` | `https://lms.kyoto-wu.ac.jp/portal/login` | Shibboleth SSO |\n| **Sakai 公式 (Nightly)** | `https://trunk-maria.nightly.sakaiproject.org/portal` | `https://trunk-maria.nightly.sakaiproject.org/portal/xlogin` | ローカルフォーム認証 |\n", "guide.md": "# 開発者向け Sakai-Tasks-MCP ガイド\n\n## 1. 完成品がどう動くかの説明書\n\n本プロジェクトのゴールは、**「AI アシスタント（Claude Desktop, Cursor 等）が、ユーザーの代わりに大学の Sakai（LMS）から課題・テスト・お知らせ・講義資料を安全に取得・要約できるようにする」** ことです。\n\n```mermaid\nflowchart LR\n    User[\"学生 / ユーザー\"] <-->|\"対話\"| AI[\"AI アシスタント<br/>(Claude Desktop 等)\"]\n    AI <-->|\"stdio (MCP Protocol)\"| Server[\"sakai-tasks-mcp\"]\n    Server <-->|\"REST API / HTML\"| Sakai[\"大学 Sakai LMS\"]\n    Server -.->|\"セッション切れ時に<br/>一時ポップアップ\"| AuthUI[\"認証 / 設定 WebView\"]\n```\n\n---\n\n### ユーザー目線での利用フロー\n\n1. **直近締切の確認**:\n   * **ユーザー**: 「今週締め切りの課題や小テストはある？」\n   * **AI**: `get_upcoming_deadlines` ツールを実行し、「2026/09/05 23:59 締切の『人工知能基礎 レポート課題3』があります」と回答。\n2. **課題内容・指示文の確認**:\n   * **ユーザー**: 「そのレポート課題3の文字数や提出要件を教えて」\n   * **AI**: `get_assignments` ツールで詳細指示文を取得し、要点を分かりやすく整理。\n3. **休講・重要連絡の確認**:\n   * **ユーザー**: 「直近で休講や教室変更のお知らせはある？」\n   * **AI**: `get_announcements` ツールでお知らせ一覧を取得し、最新の連絡を要約。\n4. **講義総合ダッシュボードの確認**:\n   * **ユーザー**: 「ソフトウェア工学演習の状況を全部教えて」\n   * **AI**: `get_course_dashboard` ツールを実行し、未提出課題・テスト・最新連絡・授業資料を 1 発でまとめて報告。\n5. **講義ごとの AI 権限設定（設定 GUI の起動）**:\n   * **ユーザー**: 「設定画面を開いて」\n   * **AI**: `open_settings` ツールを実行し、デスクトップ上に設定画面（ポップアップ）を表示。ユーザー自身が「この講義は資料読み込みを許可する」といった設定を画面上で変更・保存。\n\n---\n\n### システム内部の動作フロー\n\n* **通常時**:\n  AI から要求が届くと、ローカルに暗号化保存されたセッション情報（Cookie）を用いて Sakai Direct REST API を叩き、ポリシーフィルタを通過させた安全な構造化データ（JSON Schema）を即座に AI へ返却します（約 0.2〜0.5 秒）。\n* **セッション切れ・初回実行時**:\n  Cookie の期限切れ（24 時間放置等）を検知すると、OS 備え付けのブラウザエンジン（Edge WebView2）が一時起動し、大学 SSO の永続 Cookie を利用して **0.5 秒で自動素通り認証**（または手動ログイン）を行い、新しいセッションを暗号化保存して本来のリクエストに復帰します。\n\n---\n\n## 2. 使用技術 & ライブラリの説明\n\n本プロジェクトで採用している主要な技術・ライブラリの役割と選定理由は以下の通りです。\n\n| 技術 / ライブラリ | 本プロジェクトでの役割 & 選定理由 |\n| :--- | :--- |\n| **FastMCP (`mcp`)** | **MCP サーバーフレームワーク**: AI モデルと Python プログラムを繋ぐインターフェース。関数に `@mcp.tool()` デコレータを付与するだけで、stdio 経由で AI 向けツール API を公開可能。 |\n| **`httpx`** | **非同期 HTTP クライアント**: `async/await` 構文を用いて、Sakai の Direct REST API や Portal HTML と高速かつ非同期に HTTP 通信を実行。 |\n| **`Pydantic v2`** | **データモデル定義 & バリデーション**: Sakai API レスポンスの防御的パース、型安全性確保、および AI 向け JSON Schema の自動生成を担当。 |\n| **`pywebview`** | **OS 標準ブラウザ (WebView) 連携**: Windows (Edge WebView2) や macOS (WebKit) のブラウザエンジンを呼び出し、大学 SSO 認証の自動素通りや設定 GUI 画面のポップアップ表示を担当。 |\n| **Embeddable Python /<br/>python-build-standalone** | **ポータブルランタイム配布方式**: Python がインストールされていない学生 PC でも、ZIP を解凍するだけで即動作するゼロ・セットアップ環境を提供（アンチウイルス誤検知を完全回避）。 |\n\n---\n\n## 3. Sakai のエンドポイント & データ取得の仕組み\n\nSakai には公式に **Direct REST API（EntityBroker）** が備わっており、特別なスクレイピングを行わなくても通常の JSON API を叩くだけでデータを取得できます。\n\n### 主要エンドポイント一覧\n\n| エンドポイント / URL | 用途 | 取得形式 | 担当パーサー (`src/client/parsers/`) |\n| :--- | :--- | :--- | :--- |\n| **`/direct/site.json`** | 履修・所属講義一覧 | REST JSON | `course_parser.py` |\n| **`/portal`** (HTML) | お気に入り（★）講義の抽出 | HTML DOM | `favorite_parser.py` (BeautifulSoup) |\n| **`/direct/assignment/my.json`** | 全講義の課題一覧（締切・タイトル） | REST JSON | `assignment_parser.py` |\n| **`/direct/sam_pub/context/{siteId}.json`** | 指定講義のテスト・クイズ一覧 | REST JSON | `quiz_parser.py` |\n| **`/direct/announcement/user.json`** | 全講義のお知らせ一覧 (`?n=...`) | REST JSON | `announcement_parser.py` |\n| **`/direct/calendar/my.json`** | カレンダー予定・イベント一覧 | REST JSON | `calendar_parser.py` |\n| **`/direct/content/site/{siteId}.json`** | 授業資料・配布ファイル一覧 | REST JSON | `content_parser.py` |\n| **`/direct/session/current.json`** | セッション有効性確認 | REST JSON | `session_checker.py` (`userEid` 判定) |\n\n---\n\n### お気に入り講義の抽出ロジック（Comfortable Sakai の知見）\n\n* Sakai 公式の `/direct/site.json` には「お気に入り（ピン留め）」を判別するフラグが含まれていません。\n* そこで、京都大学等で使われている Comfortable Sakai の知見に基づき、ログイン済み Cookie で `/portal` の HTML を取得し、`.fav-sites-entry` クラスの DOM 要素から **★お気に入り講義 ID を高速に抽出してマージ** します。\n\n---\n\n### API データを扱う上での 2 大注意点\n\n1. **日時の単位の不統一 (秒 vs ミリ秒)**:\n   * 課題 (`/assignment`): 秒単位のオブジェクト `{ \"epochSecond\": 1712600000, \"nano\": 0 }`\n   * テスト (`/sam_pub`)・お知らせ・カレンダー・教材: ミリ秒数値 `1712600000000`\n   * `parsers/base.py` の `parse_datetime` 共通関数で自動判定・正規化します。\n2. **ID プロパティ名の揺れ**:\n   * 講義・課題は `id`、テストは `publishedAssessmentId`、お知らせは `announcementId` です。これらは各パーサー内で共通データモデル（`SakaiTask` 等）に詰め替えて吸収します。\n\n---\n\n## 4. 認証システム & セキュリティ設計\n\n### ① Cookie ベースのセッション管理 & 失効検知\n\nSakai API は **`SAKAI2SESSIONID` Cookie** でセッションを識別します。\n* **24 時間スライディング・タイムアウト**: 最後のアクセスから 24 時間操作がないと失効します。\n* **特殊な失効挙動**: セッション失効時でも `401 Unauthorized` ではなく、**`200 OK` で `{\"userEid\": null}` を返す** ため、`userEid is not None` で真のログイン状態を判定します。\n* **暗号化保存**: Cookie は Windows DPAPI（または Fernet）を用いて `session.enc` に安全に保存されます。\n\n---\n\n### ② 大学統合認証（SSO / Microsoft 365）と WebView 自動素通り\n\n```mermaid\nsequenceDiagram\n    autonumber\n    actor User as ユーザー / WebView2\n    participant Sakai as ① Sakai (/portal/login)\n    participant IdP as ② 大学認証基盤 (IdP / Microsoft 365)\n\n    User->>Sakai: ① ログインURLにアクセス (/portal/login)\n    Sakai-->>User: ② 大学の認証画面へリダイレクト (SAML 要求)\n    User->>IdP: ③ 大学の認証サーバーへアクセス (永続 Cookie 送信)\n\n    alt パターン A: 普段の再認証（IdP Cookie 有効 / 0.5 秒素通り）\n        Note over IdP: IdP 側のログイン記憶 Cookie が有効\n        IdP-->>User: 画面入力なしで認証成功トークンを即返却 (JS 自動 POST)\n        User->>Sakai: ④ 認証結果を Sakai へ送信\n        Sakai-->>User: ⑤ 新しい SAKAI2SESSIONID を発行（画面非表示で自動完了!）\n    else パターン B: 初回・完全失効時\n        Note over IdP: ログイン記憶なし\n        IdP-->>User: パスワード・2段階認証画面を表示\n        User->>IdP: ユーザーが手動で認証情報を入力\n        IdP-->>User: 認証成功トークン返却\n        User->>Sakai: ④ 認証結果を Sakai へ送信\n        Sakai-->>User: ⑤ 新しい SAKAI2SESSIONID を発行（完了!）\n    end\n```\n\n* **自動素通り (0.5秒)**: 固定プロファイル（`webview_profile/`）を指定して WebView2 を起動するため、IdP の永続 Cookie が残り、**画面を出さずに裏で 0.5 秒で新セッションを取得** できます。\n* **多重起動の排他制御 (`asyncio.Lock`)**: AI から複数ツールが同時に呼ばれても、ログイン画面が多重に開くのを完全に防止します。\n\n---\n\n### ③ 講義別 AI 利用ポリシー & 設定 GUI\n\n#### 1. 講義ごとの 4 段階権限ポリシー\n\nセキュリティおよび著作権保護の観点（**Secure by Default 原則**）に基づき、新規・未設定講義はすべて **`TEXT_ONLY`（強: ファイルDL禁止）** が自動適用されます。\n\n| 権限レベル (Enum) | 説明 |\n| :--- | :--- |\n| **`ALLOW_ALL`** (全て) | **完全アクセス**: 資料ダウンロード・課題指示文・お知らせ・締切すべて利用可能。 |\n| **`TEXT_ONLY`** (強 / ★デフォルト) | **テキストのみ**: 課題指示文やお知らせ本文は取得できるが、PDF・スライド等のファイル実体ダウンロードを禁止。 |\n| **`SCHEDULE_ONLY`** (弱) | **締切・予定のみ**: 課題指示文や本文を `[講義ポリシーにより非表示]` とマスクし、締切管理のみ許可。 |\n| **`BLOCKED`** (無効) | **完全除外**: 講義一覧を含め、その講義の存在自体を AI ツールから完全に隠蔽。 |\n\n```json\n{\n  \"sakai_host\": \"tact.ac.thers.ac.jp\",\n  \"policies\": {\n    \"2024_01_AI101\": \"allow_all\",\n    \"2024_01_LAW202\": \"text_only\",\n    \"2024_01_SE303\": \"schedule_only\"\n  },\n  \"default_deadline_days\": 30,\n  \"default_announcement_limit\": 7\n}\n```\n\n---\n\n#### 2. 設定 GUI の 3 ファイル責務分離 (`src/gui/`)\n\n設定画面は単一責任の原則（SRP）に基づき、以下の 3 ファイルに分離されています。\n\n1. **`data_builder.py`**: Sakai から講義一覧を取得し、既存ポリシーとマージしてお気に入り優先にソートした単一 JSON（`SettingsUIData`）を構築（GUI に依存しない純粋関数）。\n2. **`api.py`**: JavaScript と Python の通信ブリッジ（`get_initial_data`, `save_settings`）。\n3. **`settings_window.py`**: データを注入して `pywebview` ウィンドウを起動する薄いコントローラー。\n\nこれにより、**設定画面を開く前にすべてのデータ準備が完了するため、GUI の多重起動や競合が起きず**、フロントエンド担当者もブラウザ単体で独立モック開発が可能です。\n\n---\n\n## 5. モジュール構成 & 実装の進め方\n\n```text\nsakai-tasks-mcp/\n├── src/\n│   ├── models.py             # 共通 Pydantic モデル定義\n│   ├── config.py             # 設定・定数管理 (Config, AIPolicyMode)\n│   ├── auth/                 # 認証・セッション管理 (session_manager, webview_auth 等)\n│   ├── client/               # Sakai API クライアント (sakai_client, parsers/*)\n│   ├── policy/               # 講義別 AI ポリシーフィルタ (policy_filter)\n│   ├── gui/                  # 設定 GUI (data_builder, api, settings_window, templates)\n│   └── server.py             # FastMCP サーバー本体 (stdio エントリポイント)\n└── tests/                    # 単体・結合テスト群\n```\n\n各ファイルを実装する際は、**`docs/architecture.md` の該当セクションおよび第 1〜3 章** を参照することで、他のモジュールに迷わずに独立して開発・テストを進めることができます。\n"}
  </script>

    (function() {

        if (isFileProtocol && isMdTarget) {

          return new Response(content, {

          });
        }
        
        try {
          const response = await originalFetch(resource, init);
          if (!response.ok && isMdTarget) {
            const content = getMatchingContent(url);
            return new Response(content, {
              status: 200,
              statusText: 'OK',
              headers: { 'Content-Type': 'text/markdown; charset=utf-8' }
            });
          }
          return response;
        } catch (err) {
          if (isMdTarget) {
            const content = getMatchingContent(url);
            return new Response(content, {
              status: 200,
              statusText: 'OK',
              headers: { 'Content-Type': 'text/markdown; charset=utf-8' }
            });
          }
          throw err;
        }
      };
    })();
  </script>

  <!-- Mermaid.js Library -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

  <!-- Docsify Configuration & Plugins -->
  <script>
    // Mermaid 初期設定
    let currentMermaidTheme = 'default';
    if (localStorage.getItem('docsify-theme') === 'dark' || 
        (!localStorage.getItem('docsify-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      currentMermaidTheme = 'dark';
    }

    mermaid.initialize({
      startOnLoad: false,
      theme: currentMermaidTheme,
      securityLevel: 'loose',
      flowchart: { useMaxWidth: true, htmlLabels: true, curve: 'basis' },
      sequence: { useMaxWidth: true }
    });

    let mermaidIndex = 0;

    // Docsify 設定
    window.$docsify = {
      name: 'Sakai-Tasks-MCP',
      repo: '',
      homepage: 'architecture.md',
      loadSidebar: false, // 見出しから自動抽出
      subMaxLevel: 3,
      maxLevel: 4,
      auto2top: true,
      notFoundPage: false,
      themeColor: '#2563eb',
      
      // Markdown レンダラーで mermaid コードブロックを直接 <div class="mermaid"> に変換
      markdown: {
        renderer: {
          code: function(code, lang) {
            if (lang === 'mermaid') {
              return '<div class="mermaid" id="mermaid-' + (++mermaidIndex) + '">' + code + '</div>';
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      },

      // 全文検索
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '検索...',
        noData: '一致する結果が見つかりません',
        depth: 4,
        hideOtherSidebarContent: false,
      },

      // コードコピー
      copyCode: {
        buttonText: 'コピー',
        errorText: 'エラー',
        successText: 'コピー完了',
      },

      // ページ送りナビゲーション
      pagination: {
        previousText: '前の章',
        nextText: '次の章',
        crossChapter: true,
        crossChapterText: true,
      },

      plugins: [
        // 1. Mermaid 描画プラグイン & GitHub Alerts 整形
        function(hook, vm) {
          hook.afterEach(function(html, next) {
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = html;

            // GitHub Alerts (アイコンレス・テキストバッジ形式)
            const blockquotes = tempDiv.querySelectorAll('blockquote');
            blockquotes.forEach((bq) => {
              const firstP = bq.querySelector('p');
              if (!firstP) return;
              
              const text = firstP.innerHTML;
              const alertMatch = text.match(/^\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*(<br\s*\/?>)?/i);
              
              if (alertMatch) {
                const alertType = alertMatch[1].toLowerCase();
                const alertTitle = alertMatch[1].toUpperCase();
                
                firstP.innerHTML = text.replace(/^\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*(<br\s*\/?>)?/i, '');
                
                const alertDiv = document.createElement('div');
                alertDiv.className = 'alert alert-' + alertType;
                
                alertDiv.innerHTML = `
                  <div class="alert-title">${alertTitle}</div>
                  <div class="alert-content">${bq.innerHTML}</div>
                `;
                
                bq.parentNode.replaceChild(alertDiv, bq);
              }
            });

            next(tempDiv.innerHTML);
          });

          hook.doneEach(function() {
            // Mermaid の実行 (Mermaid v10 API: mermaid.run)
            try {
              if (window.mermaid) {
                window.mermaid.run({
                  querySelector: '.mermaid'
                }).catch(function(err) {
                  console.warn('Mermaid render warning:', err);
                });
              }
            } catch (e) {
              console.error('Mermaid exception:', e);
            }
          });
        }
      ]
    };
  </script>

  <!-- Theme Toggle & Back to top Logic -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const themeToggleBtn = document.getElementById('theme-toggle');
      const backToTopBtn = document.getElementById('back-to-top');

      // テーマ初期化
      const savedTheme = localStorage.getItem('docsify-theme') || 
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      
      function applyTheme(theme, reRenderMermaid = false) {
        if (theme === 'dark') {
          document.body.classList.add('dark-mode');
          themeToggleBtn.textContent = 'ライトモード';
        } else {
          document.body.classList.remove('dark-mode');
          themeToggleBtn.textContent = 'ダークモード';
        }
        localStorage.setItem('docsify-theme', theme);

        if (reRenderMermaid && window.mermaid) {
          try {
            mermaid.initialize({
              theme: theme === 'dark' ? 'dark' : 'default'
            });
            // 既存の svg をクリアして再描画したい場合はリロード
            window.location.reload();
          } catch(e) {}
        }
      }

      applyTheme(savedTheme, false);

      themeToggleBtn.addEventListener('click', () => {
        const isDark = document.body.classList.contains('dark-mode');
        applyTheme(isDark ? 'light' : 'dark', true);
      });

      // Back to Top 表示制御
      window.addEventListener('scroll', () => {
        if (window.scrollY > 300) {
          backToTopBtn.classList.add('visible');
        } else {
          backToTopBtn.classList.remove('visible');
        }
      });

      backToTopBtn.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });
  </script>
